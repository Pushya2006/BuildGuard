name: BuildGuard CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: buildguard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-assure:
    name: Build, Verify, and Evaluate Assurance
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check Python syntax
        run: |
          python -m compileall -q app scripts tests

      - name: Run automated tests
        run: python -m pytest -v

      - name: Build artifact and collect evidence
        run: python scripts/build.py

      - name: Generate SLSA-format provenance
        run: python scripts/generate_provenance.py

      - name: Verify build evidence and provenance
        run: python scripts/verify_evidence.py

      - name: Run tamper detection test
        run: python scripts/test_tamper_detection.py

      - name: Evaluate assurance
        run: python scripts/evaluate_assurance.py

      - name: Display generated report summary
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report_files = [
              "dist/verification-report.json",
              "dist/tamper-test-report.json",
              "dist/assurance-report.json",
          ]

          for filename in report_files:
              path = Path(filename)
              print(f"\n--- {filename} ---")

              if not path.is_file():
                  print("Report not generated.")
                  continue

              try:
                  with path.open("r", encoding="utf-8") as report_file:
                      report = json.load(report_file)
                  print(json.dumps(report, indent=2))
              except (OSError, json.JSONDecodeError) as exc:
                  print(f"Could not read report: {exc}")
          PY

      - name: Upload build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildguard-artifact
          path: dist/buildguard-artifact.zip
          if-no-files-found: warn
          retention-days: 14

      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildguard-evidence
          path: dist/build-evidence.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildguard-provenance
          path: dist/provenance.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildguard-verification
          path: dist/verification-report.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload tamper-test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildguard-tamper-test
          path: dist/tamper-test-report.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload assurance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildguard-assurance
          path: dist/assurance-report.json
          if-no-files-found: warn
          retention-days: 14
